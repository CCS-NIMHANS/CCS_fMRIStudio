[project]
name = "ccs-fmri-sidecar"
version = "0.4.1"
description = "Embedded Python scientific sidecar for CCS_fMRIStudio (ANTsPy, DIPY, nilearn, statsmodels)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "antspyx>=0.6.0",
    "nibabel>=5.2.0",
    "nilearn>=0.11.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs_fmri_sidecar"]
